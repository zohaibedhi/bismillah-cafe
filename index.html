<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bismillah Cafe &amp; BBQ — POS &amp; Sales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --ink:#1B2430;--ink-soft:#4A5568;--line:#E2E5EA;--line-soft:#EEF0F3;--surface:#FFFFFF;--canvas:#F5F6F8;
  --primary:#0E5C4E;--primary-dark:#093F35;--primary-soft:#E4F0EC;--accent:#C7622B;--accent-soft:#FBE9DE;
  --gold:#B08A2E;--gold-soft:#F5EFDC;--danger:#B0362C;--danger-soft:#FBE7E4;--good:#1E7A4C;--good-soft:#E5F3EA;
  --radius:8px;
  --mono:ui-monospace,SFMono-Regular,"Roboto Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--canvas);font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;}

#app{display:none;flex-direction:column;min-height:100vh;}
#topnav{background:var(--primary-dark);color:#EAF3EF;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.25);}
#topnav .nav-row{display:flex;align-items:stretch;min-height:54px;}
#topnav .brand{display:flex;align-items:center;padding:0 20px 0 18px;border-right:1px solid rgba(255,255,255,.1);flex-shrink:0;}
#topnav .brand .mark{font-family:var(--serif);font-size:17px;font-weight:700;color:#fff;}
#topnav .brand .sub{font-size:9.5px;text-transform:uppercase;letter-spacing:1.4px;color:#8FB8AC;margin-top:2px;}
.nav-menus{display:flex;align-items:stretch;flex:1;}
.nav-menu-item{position:relative;}
.nav-menu-btn{display:flex;align-items:center;gap:5px;padding:0 14px;height:54px;font-size:12.5px;font-weight:600;color:#D6E8E1;white-space:nowrap;border:none;background:none;}
.nav-menu-btn:hover,.nav-menu-btn.open{background:rgba(255,255,255,.08);color:#fff;}
.nav-menu-btn.active-group{box-shadow:inset 0 -2px 0 var(--accent);color:#fff;}
.nav-dropdown{position:absolute;top:100%;left:0;background:var(--primary-dark);border:1px solid rgba(255,255,255,.1);border-top:2px solid var(--accent);border-radius:0 0 8px 8px;min-width:220px;padding:6px 0;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;z-index:300;}
.nav-dropdown.show{display:block;}
.nav-dd-item{display:block;padding:9px 18px;font-size:12.5px;color:#D0E5DC;cursor:pointer;white-space:nowrap;text-decoration:none;}
.nav-dd-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-dd-item.active{color:#F3A877;font-weight:600;}
.nav-right{display:flex;align-items:center;gap:8px;padding:0 14px;border-left:1px solid rgba(255,255,255,.1);margin-left:auto;flex-shrink:0;}
.nav-clock{font-size:11.5px;color:#8FB8AC;font-family:var(--mono);}
.nav-pill{font-size:10.5px;padding:3px 9px;border-radius:100px;background:rgba(255,255,255,.15);color:#C8DDD7;font-weight:700;white-space:nowrap;border:1px solid rgba(255,255,255,.2);cursor:pointer;}
.nav-pill.synced{background:rgba(30,122,76,.35);color:#7BE0A8;}
.nav-pill.syncing{background:rgba(176,138,46,.3);color:#F0D07A;}
.nav-pill.error{background:rgba(176,54,44,.35);color:#F7A09A;}
.nav-user{display:flex;align-items:center;gap:7px;font-size:12px;color:#EAF3EF;}
.nav-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
#content{flex:1;padding:22px 26px 60px;max-width:1440px;width:100%;margin:0 auto;}

#loginOverlay{position:fixed;inset:0;background:var(--primary-dark);display:none;align-items:center;justify-content:center;z-index:999;}
#loginOverlay.show{display:flex;}
.login-box{background:var(--surface);border-radius:12px;padding:36px 40px;width:380px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-box .brand-lg{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--primary-dark);margin-bottom:4px;}
.login-box .brand-sub{color:var(--ink-soft);font-size:12px;margin-bottom:24px;}
.login-err{color:var(--danger);font-size:12.5px;margin-top:10px;display:none;}

h1.page-title{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 3px;}
.page-desc{color:var(--ink-soft);font-size:13px;margin:0 0 18px;max-width:760px;}
h2.section-title{font-size:14px;font-weight:700;margin:24px 0 10px;color:var(--primary-dark);display:flex;align-items:center;gap:8px;}
h2.section-title::after{content:"";flex:1;height:1px;background:var(--line);}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:8px;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);}
.kpi.accent::before{background:var(--accent);}.kpi.gold::before{background:var(--gold);}.kpi.danger::before{background:var(--danger);}
.kpi .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);font-weight:600;}
.kpi .value{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:6px;}
.kpi .sub{font-size:11px;color:var(--ink-soft);margin-top:3px;}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;}
.chart-box h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);}
.chart-box .cwrap{position:relative;height:250px;}

.equation{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.eq-box{flex:1;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;}
.eq-box .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);font-weight:700;}
.eq-box .value{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:4px;}
.eq-box.net{background:var(--primary-soft);border-color:#BFDDD3;}
.eq-box.net .value{color:var(--primary-dark);}
.eq-box.disc .value{color:var(--danger);}
.eq-op{display:flex;align-items:center;font-size:22px;font-weight:700;color:var(--ink-soft);}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:12.8px;}
thead th{text-align:left;background:var(--primary-soft);color:var(--primary-dark);padding:9px 12px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
tbody td{padding:8px 12px;border-top:1px solid var(--line-soft);white-space:nowrap;}
tbody tr:hover{background:#FAFBF9;}
tr.total-row td{background:var(--good-soft);font-weight:700;border-top:2px solid #BFDDD3;}
td.num,th.num{text-align:right;font-family:var(--mono);}
td.mono{font-family:var(--mono);}
.pos-val{color:var(--good);font-weight:700;}.neg-val{color:var(--danger);font-weight:700;}
.tag{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10.5px;font-weight:700;letter-spacing:.3px;background:var(--line-soft);color:var(--ink-soft);}
.tag.good{background:var(--good-soft);color:var(--good);}.tag.warn{background:var(--gold-soft);color:var(--gold);}
.tag.bad{background:var(--danger-soft);color:var(--danger);}.tag.info{background:var(--primary-soft);color:var(--primary-dark);}
.row-del{color:var(--danger);opacity:.6;font-size:15px;background:none;border:none;padding:0 4px;}
.row-del:hover{opacity:1;}
.empty-row td{color:var(--ink-soft);font-style:italic;text-align:center;padding:20px;}

.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;align-items:end;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.form-grid .field{margin-bottom:0;}
.field label{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select,.field textarea,.inp{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary);}
.field input:disabled{background:var(--canvas);color:var(--ink-soft);}
.btn{padding:8px 16px;border-radius:6px;border:1px solid transparent;font-weight:600;font-size:12.5px;background:var(--primary);color:#fff;}
.btn:hover{background:var(--primary-dark);}
.btn.secondary{background:#fff;color:var(--primary-dark);border-color:var(--line);}
.btn.secondary:hover{background:var(--primary-soft);}
.btn.accent{background:var(--accent);}.btn.accent:hover{background:#A34E20;}
.btn.danger{background:var(--danger);}.btn.danger:hover{background:#8E2A22;}
.btn.small{padding:5px 10px;font-size:11.5px;}
.btn.block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;cursor:pointer;}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--primary-dark);border-color:var(--accent);}
.note{background:var(--gold-soft);border:1px solid #E8D9AE;border-radius:6px;padding:10px 14px;font-size:12px;color:#6B5518;margin-bottom:14px;}
.note.blue{background:var(--primary-soft);border-color:#BFDDD3;color:var(--primary-dark);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:all .25s;z-index:10001;pointer-events:none;max-width:420px;}
.toast.show{opacity:1;transform:translateY(0);}
.flexrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.spacer{flex:1;}
.muted{color:var(--ink-soft);}
.bold{font-weight:700;}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(10,20,15,.55);z-index:900;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 10px;}
.modal-card{background:#fff;border-radius:12px;padding:24px 26px;box-shadow:0 8px 40px rgba(0,0,0,.3);max-width:100%;}
.modal-card h3{margin:0 0 6px;font-size:16px;color:var(--primary-dark);}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}

/* shift bar */
.shift-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--primary-soft);border:1px solid #BFDDD3;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--primary-dark);}
.shift-bar .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(30,122,76,.2);}

/* POS */
.pos-layout{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start;}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.menu-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;transition:border-color .15s,transform .05s;user-select:none;}
.menu-card:hover{border-color:var(--accent);}
.menu-card:active{transform:scale(.98);}
.menu-card .nm{font-weight:600;font-size:13px;}
.menu-card .cat{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.menu-card .pr{font-family:var(--mono);color:var(--primary-dark);font-weight:700;margin-top:8px;}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;position:sticky;top:70px;}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;}
.cart-item .ci-name{flex:1;min-width:0;}
.cart-item .ci-name small{display:block;color:var(--ink-soft);font-family:var(--mono);}
.qtybox{display:flex;align-items:center;gap:5px;}
.qtybox button{width:22px;height:22px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:12px;line-height:1;}
.cart-total-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;}
.cart-total-row.grand{font-weight:700;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;color:var(--primary-dark);}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.seg button{flex:1;border:none;background:#fff;padding:8px 6px;font-size:12px;font-weight:600;color:var(--ink-soft);border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.on{background:var(--primary);color:#fff;}

/* receipt */
#receiptModal{position:fixed;inset:0;background:rgba(20,25,22,.55);display:none;align-items:center;justify-content:center;z-index:950;}
#receiptModal.show{display:flex;}
.receipt-paper{width:300px;background:#fff;padding:18px 16px;font-family:var(--mono);font-size:11.5px;color:#111;max-height:78vh;overflow-y:auto;border-radius:4px;}
.receipt-paper h4{text-align:center;margin:0 0 2px;font-size:14px;}
.receipt-paper .c{text-align:center;}
.receipt-paper hr{border:none;border-top:1px dashed #999;margin:8px 0;}
.receipt-line{display:flex;justify-content:space-between;gap:8px;}

.z-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #eee;font-size:12px;}
.z-row.total{font-weight:700;border-top:2px solid #333;border-bottom:none;padding-top:6px;}
.z-sec{margin:14px 0 4px;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#555;border-bottom:1px dashed #ccc;padding-bottom:4px;}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D2D6DB;border-radius:6px;}

@media print{
  body *{visibility:hidden;}
  #receiptModal,#receiptModal *{visibility:visible;}
  #receiptModal{position:absolute;inset:auto;top:0;left:0;background:#fff;display:block;}
  #receiptModal .modal-actions{display:none !important;}
  .receipt-paper{max-height:none;overflow:visible;width:72mm;padding:0;}
  @page{margin:4mm;}
}
@media (max-width:1000px){
  #topnav .nav-row{flex-wrap:wrap;}
  .nav-menus{order:3;width:100%;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);}
  .nav-menu-btn{height:42px;}
  .nav-right{padding:6px 12px;}
  .pos-layout,.chart-row{grid-template-columns:1fr;}
  .cart{position:static;}
  #content{padding:16px 14px 50px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="brand-lg" id="loginBrand">Bismillah Cafe &amp; BBQ</div>
    <div class="brand-sub">POS &amp; Sales Management — please sign in</div>
    <div class="field"><label>Username</label><input id="loginUser" type="text" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button class="btn block" id="loginBtn" style="margin-top:10px">Sign In</button>
    <div class="login-err" id="loginErr">Invalid username or password.</div>
  </div>
</div>

<div id="app">
  <nav id="topnav">
    <div class="nav-row">
      <div class="brand"><div><div class="mark" id="brandName">Bismillah Cafe &amp; BBQ</div><div class="sub">POS &amp; Sales</div></div></div>
      <div class="nav-menus" id="navMenus"></div>
      <div class="nav-right">
        <span class="nav-clock" id="clockPill">—</span>
        <span class="nav-pill" id="syncPill" title="Cloud sync settings">☁ Local</span>
        <span class="nav-pill" id="backupPill" title="Backup &amp; Restore">💾 Backup</span>
        <span class="nav-user"><span class="nav-avatar" id="navAvatar">?</span><span id="navUserName">User</span></span>
        <button class="btn secondary small" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>
  <div id="content"></div>
</div>

<div id="receiptModal">
  <div>
    <div class="receipt-paper" id="receiptPaper"></div>
    <div class="modal-actions" style="justify-content:stretch">
      <button class="btn secondary block" id="closeReceiptBtn">Close</button>
      <button class="btn accent block" id="printReceiptBtn">Print</button>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   SECTION 1 — CONSTANTS, UTILITIES
   ===================================================================== */
const STORAGE_KEY = 'rms_pos_db_v1';
const SESSION_KEY = 'rms_pos_session_v1';
const FB_CFG_KEY  = 'rms_pos_fb_cfg_v1';
const ORDER_TYPES = ['Dine In','Take Away','Delivery'];
const PAY_METHODS = ['Cash','Card','Online/Wallet'];
const SHIFT_NAMES = ['Morning','Evening','Night','Full Day'];
const DENOMS = [5000,1000,500,100,50,20,10];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n,w){ return String(n).padStart(w||2,'0'); }
function localISO(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowTime(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return localISO(d); }
function fmtDate(iso){ if(!iso) return ''; const p=iso.split('-'); return p[2]+' '+MONTHS[+p[1]-1]+' '+p[0]; }
function monthLabel(ym){ const p=ym.split('-'); return MONTHS[+p[1]-1]+' '+p[0]; }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function fmtNum(n,dp){ dp=dp===undefined?2:dp; return (Number(n)||0).toLocaleString('en-PK',{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function fmtQty(n){ return (Number(n)||0).toLocaleString('en-PK',{maximumFractionDigits:2}); }
function cur(){ return (DB && DB.settings && DB.settings.currency) || 'Rs.'; }
function money(n){ n=Number(n)||0; return (n<0?'-':'')+cur()+' '+fmtNum(Math.abs(n),2); }
function byId(arr,key,val){ return (arr||[]).find(r=>r && r[key]===val); }
function labelOf(arr,key,val,nameKey){ const r=byId(arr,key,val); return r?r[nameKey]:(val||''); }
function maxNum(arr,prefix,key){
  let m=0; (arr||[]).forEach(r=>{ const v=String((r&&r[key])||''); if(v.startsWith(prefix)){ const rest=v.slice(prefix.length); if(/^\d+$/.test(rest)) m=Math.max(m,parseInt(rest,10)); } });
  return m;
}
function uid(prefix,arr,key,width){ return prefix+pad(maxNum(arr,prefix,key||'id')+1, width||3); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }
function toArr(x){ if(!x) return []; if(Array.isArray(x)) return x.filter(Boolean); if(typeof x==='object') return Object.values(x).filter(Boolean); return []; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function withTimeout(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }

function openModal(html,width){
  closeModal();
  const back=document.createElement('div');
  back.className='modal-back'; back.id='_modal';
  back.innerHTML=`<div class="modal-card" style="width:${width||480}px">${html}</div>`;
  document.getElementById('modalRoot').appendChild(back);
  back.addEventListener('mousedown',e=>{ if(e.target===back) closeModal(); });
  return back;
}
function closeModal(){ const m=document.getElementById('_modal'); if(m) m.remove(); }
function modalOpen(){ return !!document.getElementById('_modal'); }

/* =====================================================================
   SECTION 2 — DATA MODEL & SEED
   ===================================================================== */
const PERM = (v,a,e,d)=>({view:!!v,add:!!a,edit:!!e,del:!!d});
function seedData(){
  return {

const MASTER_TABLES = ['users','roles','menus','menuCategories','menuItems','discounts'];

function normalize(db){
  const seed=seedData();
  db = (db && typeof db==='object') ? db : {};
  db.settings = Object.assign({}, seed.settings, (db.settings && typeof db.settings==='object') ? db.settings : {});
  if(!db.settings.name || db.settings.name==='New Restaurant') db.settings.name = seed.settings.name;
  MASTER_TABLES.forEach(t=>{ db[t] = (db[t]===undefined) ? clone(seed[t]) : toArr(db[t]); });
  db.orders = toArr(db.orders);
  db.shiftSessions = toArr(db.shiftSessions);
  db.orders.forEach(o=>{ o.items = toArr(o.items); });
  db.roles.forEach(r=>{ if(!r.permissions || typeof r.permissions!=='object') r.permissions={}; });
  if(!db.users.some(u=>u.role==='Admin')) db.users.unshift(clone(seed.users[0])); // never lock out
  return db;
}
let DB = null;

/* =====================================================================
   SECTION 3 — PERSISTENCE (localStorage cache + Firebase record-level sync)
   Firebase layout under <path>:
     master/   -> settings + setup tables (whole object)
     orders/<orderId>   -> one record per order (items embedded)
     shifts/<shiftId>   -> one record per cashier shift
     counters/order|shift -> running numbers (transaction-safe across devices)
   Writing one record at a time means two tills can sell at the same
   moment without overwriting each other.
   ===================================================================== */
let _fbApp=null,_fbDb=null,_fbRoot=null,_fbConnected=false,_fbListening=false;

function saveLocal(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){} }
function loadLocal(){ try{ const raw=localStorage.getItem(STORAGE_KEY); return raw? normalize(JSON.parse(raw)) : null; }catch(e){ return null; } }
function masterOf(db){ const m={settings:db.settings}; MASTER_TABLES.forEach(t=>m[t]=db[t]); return clone(m); }
function mapOf(arr){ const o={}; arr.forEach(r=>{ const c=clone(r); delete c._unsynced; o[r.id]=c; }); return o; }
function toRemote(db){ return {master:masterOf(db), orders:mapOf(db.orders), shifts:mapOf(db.shiftSessions)}; }
function fromRemote(v){
  const m=(v&&v.master)||{};
  const db={settings:m.settings}; MASTER_TABLES.forEach(t=>db[t]=m[t]===undefined?[]:m[t]);
  db.orders=v&&v.orders; db.shiftSessions=v&&v.shifts;
  return normalize(db);
}

function setSync(state,label){
  const el=document.getElementById('syncPill'); if(!el) return;
  el.className='nav-pill'+(state?' '+state:''); el.textContent=label;
}
function fbWrite(path,val){
  if(!_fbRoot) return Promise.resolve(false);
  setSync('syncing','⟳ Saving…');
  return _fbRoot.child(path).set(val===null?null:clone(val))
    .then(()=>{ setSync('synced','✓ Synced'); return true; })
    .catch(e=>{ setSync('error','✕ Sync error'); console.error(e); return false; });
}
function saveMaster(){ saveLocal(); return fbWrite('master', masterOf(DB)); }
function saveOrder(o){
  if(!DB.orders.includes(o)) DB.orders.push(o);
  if(_fbRoot) o._unsynced=true;
  saveLocal();
  const copy=clone(o); delete copy._unsynced;
  return fbWrite('orders/'+o.id, copy).then(ok=>{ if(ok){ delete o._unsynced; saveLocal(); } return ok; });
}
function removeOrder(id){ DB.orders=DB.orders.filter(o=>o.id!==id); saveLocal(); return fbWrite('orders/'+id,null); }
function saveShift(s){
  if(!DB.shiftSessions.includes(s)) DB.shiftSessions.push(s);
  if(_fbRoot) s._unsynced=true;
  saveLocal();
  const copy=clone(s); delete copy._unsynced;
  return fbWrite('shifts/'+s.id, copy).then(ok=>{ if(ok){ delete s._unsynced; saveLocal(); } return ok; });
}

/* Next running number: uses a Firebase transaction when online so two tills never get the same number */
async function nextId(counter,prefix,arr,width){
  const localNext = maxNum(arr,prefix,'id')+1;
  if(_fbRoot && _fbConnected){
    try{
      const res = await withTimeout(_fbRoot.child('counters/'+counter).transaction(n=>Math.max(Number(n)||0, localNext-1)+1), 5000);
      if(res && res.committed) return prefix+pad(res.snapshot.val(),width);
    }catch(e){ /* fall through */ }
  }
  if(_fbRoot){ // offline with cloud configured: add a suffix so it can't clash with another till
    return prefix+pad(localNext,width)+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
  }
  return prefix+pad(localNext,width);
}

function getFbCfg(){ try{ return JSON.parse(localStorage.getItem(FB_CFG_KEY)||'{}'); }catch(e){ return {}; } }
function initFirebase(cfg){
  if(typeof firebase==='undefined') return false;
  try{
    stopFirebase();
    _fbApp = firebase.initializeApp({apiKey:cfg.apiKey, databaseURL:cfg.dbUrl, projectId:cfg.projectId}, 'rms-'+Date.now());
    _fbDb = firebase.database(_fbApp);
    _fbRoot = _fbDb.ref((cfg.path||'restaurant2').replace(/[.#$\[\]]/g,'_'));
    return true;
  }catch(e){ console.error(e); _fbApp=null;_fbDb=null;_fbRoot=null; return false; }
}
function stopFirebase(){
  if(_fbRoot){ try{ _fbRoot.off(); }catch(e){} }
  if(_fbDb){ try{ _fbDb.ref('.info/connected').off(); }catch(e){} }
  if(_fbApp){ try{ _fbApp.delete(); }catch(e){} }
  _fbApp=null;_fbDb=null;_fbRoot=null;_fbConnected=false;_fbListening=false;
}
let _rerenderT=null;
function startListener(){
  if(!_fbRoot || _fbListening) return;
  _fbListening=true;
  _fbDb.ref('.info/connected').on('value', s=>{
    _fbConnected=!!s.val();
    if(_fbConnected){ setSync('synced','✓ Synced'); pushUnsynced(); } else setSync('error','✕ Offline');
  });
  _fbRoot.on('value', snap=>{
    const v=snap.val();
    if(!v || !v.master) return;
    // keep any local records that have not reached the server yet
    const pendingOrders = DB ? DB.orders.filter(o=>o._unsynced) : [];
    const pendingShifts = DB ? DB.shiftSessions.filter(s=>s._unsynced) : [];
    DB = fromRemote(v);
    pendingOrders.forEach(p=>{ const i=DB.orders.findIndex(o=>o.id===p.id); if(i>=0) DB.orders[i]=p; else DB.orders.push(p); });
    pendingShifts.forEach(p=>{ const i=DB.shiftSessions.findIndex(o=>o.id===p.id); if(i>=0) DB.shiftSessions[i]=p; else DB.shiftSessions.push(p); });
    saveLocal();
    refreshCurrentUser();
    applyBranding();
    clearTimeout(_rerenderT);
    _rerenderT=setTimeout(liveRerender,250);
  }, err=>{ setSync('error','✕ '+(err.code||'Error')); });
}
function pushUnsynced(){
  if(!DB) return;
  DB.orders.filter(o=>o._unsynced).forEach(o=>saveOrder(o));
  DB.shiftSessions.filter(s=>s._unsynced).forEach(s=>saveShift(s));
}

/* =====================================================================
   SECTION 5 — SALES COMPUTATION
   ===================================================================== */
function itemOf(id){ return byId(DB.menuItems,'id',id); }
function catIdOf(l){ const mi=itemOf(l.itemId); return mi?mi.catId:l.catId; }
function menuIdOf(l){ const mi=itemOf(l.itemId); return mi?mi.menuId:l.menuId; }
function catName(id){ return labelOf(DB.menuCategories,'id',id,'name')||'(Uncategorised)'; }
function menuName(id){ return labelOf(DB.menus,'id',id,'name')||'(No menu type)'; }
function calcDiscount(gross,disc){
  if(!disc) return 0;
  const v=Number(disc.value)||0;
  const amt = disc.type==='Percent' ? gross*v/100 : v;
  return Math.max(0, Math.min(round2(amt), gross));
}
function linesGross(items){ return round2(items.reduce((s,l)=>s+(Number(l.price)||0)*(Number(l.qty)||0),0)); }
function validOrders(){ return DB.orders.filter(o=>o.status!=='Void'); }

/* Report dimensions. Discount is order-level, so for item/category/menu-type
   views it is spread across the order's lines in proportion to line value. */
const DIMS = {
  menuType:{label:'Menu Type', key:(o,l)=>menuIdOf(l)||'', name:k=>menuName(k), sort:'net'},
  category:{label:'Category', key:(o,l)=>catIdOf(l)||'', name:k=>catName(k), sort:'net'},
  item:{label:'Menu Item', key:(o,l)=>l.itemId, name:(k,l)=>{ const mi=itemOf(k); return mi?mi.name:(l.name||k); }, sort:'net', extra:true},
  date:{label:'Date', key:o=>o.date, name:k=>fmtDate(k), sort:'key'},
  month:{label:'Month', key:o=>(o.date||'').slice(0,7), name:k=>monthLabel(k), sort:'key'},
  orderType:{label:'Order Type', key:o=>o.orderType||'Dine In', name:k=>k, sort:'net'},
  time:{label:'Time (Hour)', key:o=>(o.time||'00:00').slice(0,2), name:k=>{ const h=+k; const f=x=>((x%12)||12)+(x<12?' AM':' PM'); return f(h)+' – '+f((h+1)%24); }, sort:'key'},
  payment:{label:'Payment Method', key:o=>o.payMethod||'Cash', name:k=>k, sort:'net'},
  shift:{label:'Shift', key:o=>o.shiftName||'—', name:k=>k, sort:'net'},
};
function filterOrders(f){
  return validOrders().filter(o=>{
    if(f.from && o.date<f.from) return false;
    if(f.to && o.date>f.to) return false;
    if(f.orderType && o.orderType!==f.orderType) return false;
    if(f.payMethod && o.payMethod!==f.payMethod) return false;
    if(f.shiftName && o.shiftName!==f.shiftName) return false;
    if(f.cashierId && o.cashierId!==f.cashierId) return false;
    return true;
  });
}
function aggregate(orders,dimKey,f){
  f=f||{};
  const dim=DIMS[dimKey];
  const map=new Map();
  const tot={orders:new Set(),qty:0,gross:0,discount:0};
  orders.forEach(o=>{
    const og=linesGross(o.items); const od=Number(o.discount)||0;
    o.items.forEach(l=>{
      if(f.menuId && menuIdOf(l)!==f.menuId) return;
      if(f.catId && catIdOf(l)!==f.catId) return;
      const g=(Number(l.price)||0)*(Number(l.qty)||0);
      const d= og ? od*g/og : 0;
      const k=dim.key(o,l);
      let r=map.get(k);
      if(!r){ r={key:k,name:dim.name(k,l),cat:dim.extra?catName(catIdOf(l)):'',orders:new Set(),qty:0,gross:0,discount:0}; map.set(k,r); }
      r.orders.add(o.id); r.qty+=Number(l.qty)||0; r.gross+=g; r.discount+=d;
      tot.orders.add(o.id); tot.qty+=Number(l.qty)||0; tot.gross+=g; tot.discount+=d;
    });
  });
  const totNet=tot.gross-tot.discount;
  const rows=[...map.values()].map(r=>({key:r.key,name:r.name,cat:r.cat,orders:r.orders.size,qty:r.qty,
    gross:round2(r.gross),discount:round2(r.discount),net:round2(r.gross-r.discount),
    avg: r.orders.size? (r.gross-r.discount)/r.orders.size : 0,
    share: totNet? (r.gross-r.discount)/totNet*100 : 0}));
  if(dim.sort==='key') rows.sort((a,b)=>String(a.key).localeCompare(String(b.key)));
  else rows.sort((a,b)=>b.net-a.net);
  const total={name:'TOTAL',cat:'',orders:tot.orders.size,qty:tot.qty,gross:round2(tot.gross),discount:round2(tot.discount),
    net:round2(totNet),avg:tot.orders.size?totNet/tot.orders.size:0,share:totNet?100:0};
  return {rows,total};
}

/* ---------- Shift stats ---------- */
function shiftOrders(ssId){ return validOrders().filter(o=>o.shiftSessionId===ssId); }
function shiftStats(ss){
  const os=shiftOrders(ss.id);
  const st={orders:os.length,qty:0,gross:0,discount:0,net:0,cash:0,card:0,online:0};
  os.forEach(o=>{
    st.gross+=Number(o.gross)||0; st.discount+=Number(o.discount)||0; st.net+=Number(o.net)||0;
    o.items.forEach(l=>st.qty+=Number(l.qty)||0);
    if(o.payMethod==='Cash') st.cash+=Number(o.net)||0;
    else if(o.payMethod==='Card') st.card+=Number(o.net)||0;
    else st.online+=Number(o.net)||0;
  });
  st.opening=Number(ss.openingCash)||0;
  st.expected=st.opening+st.cash;
  st.counted= ss.status==='Closed' ? (Number(ss.countedCash)||0) : null;
  st.diff= st.counted===null ? null : st.counted-st.expected;
  ['gross','discount','net','cash','card','online','expected'].forEach(k=>st[k]=round2(st[k]));
  if(st.diff!==null) st.diff=round2(st.diff);
  return st;
}
function myOpenShift(){ return currentUser ? DB.shiftSessions.find(s=>s.status==='Open' && s.cashierId===currentUser.id) : null; }

/* =====================================================================
   SECTION 6 — TABLE DEFINITIONS + PDF / EXCEL EXPORT
   def = {title, cols:[{label,key,type}], rows:[...], total:{...}|null}
   type: text | int | qty | money | pct | diff
   ===================================================================== */
const NUM_TYPES=['int','qty','money','pct','diff'];
function isNumCol(c){ return NUM_TYPES.includes(c.type); }
function fmtCell(c,v,forPdf){
  if(c.type==='text' || !c.type) return forPdf? String(v===undefined||v===null?'':v) : esc(v===undefined||v===null?'':v);
  if(v===null||v===undefined||v==='') return forPdf?'—':'—';
  if(c.type==='int') return fmtNum(v,0);
  if(c.type==='qty') return fmtQty(v);
  if(c.type==='pct') return (Number(v)||0).toFixed(1)+'%';
  if(c.type==='money') return forPdf? fmtNum(v,2) : money(v);
  if(c.type==='diff'){ const n=Number(v)||0; const s=(n>0?'+':'')+fmtNum(n,2); return forPdf? s : `<span class="${n<0?'neg-val':(n>0?'pos-val':'')}">${esc(s)}</span>`; }
  return esc(v);
}
function tableHTML(def){
  let h=`<div class="table-wrap"><table><thead><tr>${def.cols.map(c=>`<th class="${isNumCol(c)?'num':''}">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>`;
  if(!def.rows.length) h+=`<tr class="empty-row"><td colspan="${def.cols.length}">${esc(def.empty||'No sales found for the selected filters.')}</td></tr>`;
  else{
    h+=def.rows.map(r=>`<tr>${def.cols.map(c=>`<td class="${isNumCol(c)?'num':''}">${fmtCell(c,r[c.key])}</td>`).join('')}</tr>`).join('');
    if(def.total) h+=`<tr class="total-row">${def.cols.map((c,i)=>`<td class="${isNumCol(c)?'num':''}">${i===0?'TOTAL':(def.total[c.key]===undefined||c.noTotal?'':fmtCell(c,def.total[c.key]))}</td>`).join('')}</tr>`;
  }
  return h+`</tbody></table></div>`;
}
function reportMeta(lines){ return [...lines, 'Generated: '+fmtDate(localISO())+' '+nowTime()+' by '+(currentUser?currentUser.name:'')]; }
function safeName(s){ return String(s).replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase(); }

function exportPDF(title, defs, meta, fileName){
  const J=window.jspdf && window.jspdf.jsPDF;
  if(!J){ toast('PDF library could not load (check internet). Opening print view instead.'); return printTables(title,defs,meta); }
  const maxCols=Math.max(...defs.map(d=>d.cols.length));
  const doc=new J({orientation:maxCols>7?'landscape':'portrait',unit:'pt',format:'a4'});
  if(typeof doc.autoTable!=='function'){ toast('PDF table plugin missing — opening print view instead.'); return printTables(title,defs,meta); }
  const W=doc.internal.pageSize.getWidth();
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text(DB.settings.name||'Bismillah Cafe & BBQ',40,40);
  doc.setFontSize(12); doc.text(title,40,58);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90);
  let y=74; meta.forEach(m=>{ doc.text(m,40,y); y+=11; });
  doc.setTextColor(0);
  doc.text('Amounts in '+cur(), W-40, 40, {align:'right'});
  y+=4;
  defs.forEach((def,di)=>{
    if(def.title && defs.length>1){ doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.text(def.title,40,y+10); y+=16; doc.setFont('helvetica','normal'); }
    const colStyles={}; def.cols.forEach((c,i)=>{ if(isNumCol(c)) colStyles[i]={halign:'right'}; });
    const body=def.rows.map(r=>def.cols.map(c=>fmtCell(c,r[c.key],true)));
    const foot=(def.total && def.rows.length)? [def.cols.map((c,i)=>i===0?'TOTAL':(def.total[c.key]===undefined||c.noTotal?'':fmtCell(c,def.total[c.key],true)))] : undefined;
    doc.autoTable({
      head:[def.cols.map(c=>c.label)], body: body.length?body:[[{content:'No data',colSpan:def.cols.length,styles:{halign:'center',fontStyle:'italic'}}]],
      foot, startY:y, margin:{left:40,right:40}, theme:'grid',
      styles:{fontSize:8,cellPadding:4,overflow:'linebreak'},
      headStyles:{fillColor:[14,92,78],textColor:255,fontStyle:'bold'},
      footStyles:{fillColor:[228,240,236],textColor:20,fontStyle:'bold'},
      columnStyles:colStyles, showFoot:'lastPage',
      didParseCell:d=>{ if((d.section==='head'||d.section==='foot') && isNumCol(def.cols[d.column.index]||{})) d.cell.styles.halign='right'; },
    });
    y=doc.lastAutoTable.finalY+20;
  });
  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120);
    doc.text('Page '+i+' of '+pages, W-40, doc.internal.pageSize.getHeight()-20, {align:'right'}); }
  doc.save((fileName||safeName(title))+'.pdf');
  toast('PDF downloaded');
}
function printTables(title,defs,meta){
  const w=window.open('','_blank'); if(!w){ toast('Allow pop-ups to print'); return; }
  const tbl=d=>`<h3>${esc(d.title||'')}</h3>`+tableHTML(d).replace(/<span[^>]*>|<\/span>/g,'');
  w.document.write(`<html><head><title>${esc(title)}</title><style>body{font-family:Arial,sans-serif;font-size:11px;padding:16px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:4px 6px;text-align:left}.num{text-align:right}.total-row td{font-weight:bold;background:#eef}</style></head><body>
    <h2>${esc(DB.settings.name)}</h2><h3>${esc(title)}</h3>${meta.map(m=>`<div>${esc(m)}</div>`).join('')}${defs.map(tbl).join('')}</body></html>`);
  w.document.close(); w.focus(); w.print();
}
function defToSheetAOA(def,title,meta){
  const aoa=[[DB.settings.name||'Bismillah Cafe & BBQ'],[title],...meta.map(m=>[m]),['Amounts in '+cur()],[]];
  aoa.push(def.cols.map(c=>c.label));
  const raw=(c,v)=>{ if(!isNumCol(c)) return v===undefined||v===null?'':v; if(v===null||v===undefined||v==='') return ''; return c.type==='pct'? Math.round(v*10)/10 : (c.type==='int'?Number(v):round2(v)); };
  def.rows.forEach(r=>aoa.push(def.cols.map(c=>raw(c,r[c.key]))));
  if(def.total && def.rows.length) aoa.push(def.cols.map((c,i)=>i===0?'TOTAL':(def.total[c.key]===undefined||c.noTotal?'':raw(c,def.total[c.key]))));
  return aoa;
}
function exportExcel(sheets,fileName){
  if(typeof XLSX==='undefined'){ toast('Excel library could not load (check internet)'); return; }
  const wb=XLSX.utils.book_new();
  const used=new Set();
  sheets.forEach(s=>{
    const ws=XLSX.utils.aoa_to_sheet(defToSheetAOA(s.def,s.title,s.meta));
    ws['!cols']=s.def.cols.map(c=>({wch:Math.max(14,c.label.length+3, c.type==='text'?26:14)}));
    let nm=(s.sheet||s.def.title||'Report').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31); let n=nm,i=2; while(used.has(n)){ n=nm.slice(0,28)+' '+(i++); } used.add(n);
    XLSX.utils.book_append_sheet(wb,ws,n);
  });
  XLSX.writeFile(wb,(fileName||'report')+'.xlsx');
  toast('Excel file downloaded');
}

      <div class="eq-box"><div class="label">Gross Sales</div><div class="value">${money(tAgg.gross)}</div></div>
      <div class="eq-op">−</div>
      <div class="eq-box disc"><div class="label">Discount</div><div class="value">${money(tAgg.discount)}</div></div>
      <div class="eq-op">=</div>
      <div class="eq-box net"><div class="label">Net Sales</div><div class="value">${money(tAgg.net)}</div></div>
    </div>
    <div class="grid-kpi">
      <div class="kpi"><div class="label">Orders Today</div><div class="value">${tAgg.orders}</div><div class="sub">${fmtQty(tAgg.qty)} items sold</div></div>
      <div class="kpi accent"><div class="label">Avg Order Value</div><div class="value">${money(tAgg.avg)}</div></div>
      <div class="kpi gold"><div class="label">vs Yesterday</div><div class="value ${vs!==null&&vs<0?'neg-val':''}">${vs===null?'—':(vs>=0?'+':'')+vs.toFixed(1)+'%'}</div><div class="sub">Yesterday net ${money(yAgg.net)}</div></div>
      <div class="kpi"><div class="label">Month-to-date Net</div><div class="value">${money(mAgg.net)}</div><div class="sub">${mAgg.orders} orders · disc ${money(mAgg.discount)}</div></div>
      <div class="kpi ${openShifts.length?'':'danger'}"><div class="label">Open Shifts</div><div class="value">${openShifts.length}</div><div class="sub">${openShifts.map(s=>esc(s.cashierName)).join(', ')||'No till open'}</div></div>
    </div>
    <div class="chart-row">
      <div class="chart-box"><h3>Net Sales — Last 14 Days</h3><div class="cwrap"><canvas id="chDays"></canvas></div></div>
      <div class="chart-box"><h3>This Month by Category</h3><div class="cwrap"><canvas id="chCat"></canvas></div></div>
    </div>
    <div class="chart-row">
      <div class="chart-box"><h3>Top 10 Items This Month (Net)</h3><div class="cwrap"><canvas id="chItems"></canvas></div></div>
      <div class="chart-box"><h3>This Month by Hour</h3><div class="cwrap"><canvas id="chHour"></canvas></div></div>
    </div>
    <div class="chart-row">
      <div class="chart-box"><h3>This Month by Order Type</h3><div class="cwrap"><canvas id="chType"></canvas></div></div>
      <div class="chart-box"><h3>This Month by Menu Type</h3><div class="cwrap"><canvas id="chMenu"></canvas></div></div>
    </div>`;

  const days=[]; for(let i=13;i>=0;i--) days.push(addDays(today,-i));
  const dAgg=aggregate(filterOrders({from:days[0],to:today}),'date').rows;
  const dMap=Object.fromEntries(dAgg.map(r=>[r.key,r.net]));
  const opt={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}};
  mkChart('chDays',{type:'bar',data:{labels:days.map(d=>d.slice(8)+' '+MONTHS[+d.slice(5,7)-1]),datasets:[{label:'Net Sales',data:days.map(d=>dMap[d]||0),backgroundColor:PALETTE[0]}]},options:opt});
  const cat=aggregate(mOrders,'category').rows;
  mkChart('chCat',{type:'doughnut',data:{labels:cat.map(r=>r.name),datasets:[{data:cat.map(r=>r.net),backgroundColor:PALETTE}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'}}}});
  const items=aggregate(mOrders,'item').rows.slice(0,10);
  mkChart('chItems',{type:'bar',data:{labels:items.map(r=>r.name),datasets:[{label:'Net',data:items.map(r=>r.net),backgroundColor:PALETTE[1]}]},options:Object.assign({},opt,{indexAxis:'y'})});
  const hrs=aggregate(mOrders,'time').rows;
  mkChart('chHour',{type:'bar',data:{labels:hrs.map(r=>r.name.split(' – ')[0]),datasets:[{label:'Net',data:hrs.map(r=>r.net),backgroundColor:PALETTE[2]}]},options:opt});
  const ot=aggregate(mOrders,'orderType').rows;
  mkChart('chType',{type:'bar',data:{labels:ot.map(r=>r.name),datasets:[{label:'Net',data:ot.map(r=>r.net),backgroundColor:PALETTE[3]}]},options:opt});
  const mt=aggregate(mOrders,'menuType').rows;
  mkChart('chMenu',{type:'pie',data:{labels:mt.map(r=>r.name),datasets:[{data:mt.map(r=>r.net),backgroundColor:PALETTE}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'}}}});
}

const POS={cart:[],editingId:null,customer:{name:'',contact:'',address:''},filters:{menu:'',cat:'',q:''},orderType:'Dine In',discId:'DC00',pay:'Cash',tendered:'',tab:'order',saving:false};
function resetPOS(){ POS.cart=[]; POS.editingId=null; POS.customer={name:'',contact:'',address:''}; POS.discId='DC00'; POS.pay='Cash'; POS.tendered=''; POS.orderType='Dine In'; }
function canModifyOrder(o,action){
  if(isAdmin()) return true;
  const ss=byId(DB.shiftSessions,'id',o.shiftSessionId);
  if(!ss || ss.status!=='Open') return false;
  return action==='del'?canDel('pos'):canEdit('pos');
}

async function openShiftFor(shiftName,openingCash){
  if(myOpenShift()){ toast('You already have an open shift'); return null; }
  const id=await nextId('shift','SS',DB.shiftSessions,4);
  const s={id,cashierId:currentUser.id,cashierName:currentUser.name,shiftName,date:localISO(),openTime:nowTime(),
    openingCash:Number(openingCash)||0,status:'Open',closeDate:null,closeTime:null,countedCash:0,denoms:{},coins:0,remarks:''};
  await saveShift(s).catch(()=>{});
  toast('Shift '+id+' opened');
  return s;
}
function openShiftFormHTML(){
  return `<div class="form-grid" style="max-width:560px">
    <div class="field"><label>Shift</label><select id="osName">${SHIFT_NAMES.map(n=>`<option>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Opening Cash (${esc(cur())})</label><input type="number" id="osCash" value="0" min="0" step="1"></div>
    <div class="field"><button class="btn block" id="osBtn">Open Shift</button></div></div>`;
}
function wireOpenShift(root,after){
  const b=root.querySelector('#osBtn'); if(!b) return;
  b.onclick=async()=>{ b.disabled=true; const s=await openShiftFor(root.querySelector('#osName').value, parseFloat(root.querySelector('#osCash').value)||0); b.disabled=false; if(s) after(); };
}

function renderPOSPage(c){
  window._posRefresh=null;
  const ss=myOpenShift();
  if(!ss){
    c.innerHTML=`<h1 class="page-title">POS Sales</h1>
      <p class="page-desc">Every sale is recorded against your cashier shift, so the shift summary and Z report always tie back to the till.</p>
      <div class="panel" style="max-width:640px"><h2 class="section-title" style="margin-top:0">Open your shift to start selling</h2>
      ${canAdd('shifts')?openShiftFormHTML():'<p class="muted">You don\'t have permission to open a shift. Ask a manager.</p>'}</div>`;
    wireOpenShift(c,()=>renderPOSPage(c));
    return;
  }
  const activeDiscs=DB.discounts.filter(d=>d.active!=='N');
  if(!activeDiscs.some(d=>d.id===POS.discId)) POS.discId=(activeDiscs[0]||{}).id||'';
  c.innerHTML=`
    <h1 class="page-title">POS Sales</h1>
    <div class="shift-bar"><span class="dot"></span><b>Shift ${esc(ss.id)}</b><span>${esc(ss.shiftName)} · opened ${esc(fmtDate(ss.date))} ${esc(ss.openTime)}</span><span>Cashier: ${esc(ss.cashierName)}</span>
      <span class="spacer"></span><span id="shiftLive"></span>
      <button class="btn small secondary" id="xRptBtn">X Report</button>
      <button class="btn small" id="closeShiftBtn">Close Shift</button></div>
    <div class="note" id="posEditBanner" style="display:none"></div>
    <div class="flexrow" style="margin-bottom:14px">
      <div class="field" style="min-width:150px;margin:0"><label>Menu Type</label><select id="fMenu"><option value="">All menus</option>${DB.menus.filter(m=>m.active!=='N').map(m=>`<option value="${m.id}" ${POS.filters.menu===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
      <div class="field" style="min-width:150px;margin:0"><label>Category</label><select id="fCat"><option value="">All categories</option>${DB.menuCategories.filter(x=>x.active!=='N').map(x=>`<option value="${x.id}" ${POS.filters.cat===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field" style="min-width:220px;flex:1;margin:0"><label>Search items</label><input id="fQ" type="text" placeholder="🔍 Type to filter…" autocomplete="off" value="${esc(POS.filters.q)}"></div>
    </div>
    <div class="pos-layout">
      <div><div class="menu-grid" id="menuGrid"></div></div>
      <div class="cart">
        <div class="tabs" style="margin-bottom:12px">
          <div class="tab ${POS.tab==='order'?'active':''}" data-tab="order">🛒 Order</div>
          <div class="tab ${POS.tab==='customer'?'active':''}" data-tab="customer">👤 Customer</div>
        </div>
        <div id="tabOrder" style="${POS.tab==='order'?'':'display:none'}">
          <div class="field"><label>Order Type</label><div class="seg" id="segType">${ORDER_TYPES.map(t=>`<button type="button" data-v="${t}" class="${POS.orderType===t?'on':''}">${t}</button>`).join('')}</div></div>
          <div id="cartItems"></div>
          <div class="field" style="margin-top:10px"><label>Discount</label><select id="posDisc">${activeDiscs.map(d=>`<option value="${d.id}" ${POS.discId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
          <div class="field"><label>Payment Method</label><div class="seg" id="segPay">${PAY_METHODS.map(p=>`<button type="button" data-v="${p}" class="${POS.pay===p?'on':''}">${p}</button>`).join('')}</div></div>
          <div class="field" id="tenderWrap" style="${POS.pay==='Cash'?'':'display:none'}"><label>Cash Received (optional)</label><input type="number" id="posTender" min="0" step="1" value="${esc(POS.tendered)}" placeholder="for change calculation"></div>
          <div style="margin-top:8px">
            <div class="cart-total-row"><span>Gross Sales</span><span id="cGross"></span></div>
            <div class="cart-total-row" style="color:var(--danger)"><span>Less: Discount</span><span id="cDisc"></span></div>
            <div class="cart-total-row grand"><span>Net Payable</span><span id="cNet"></span></div>
            <div class="cart-total-row" id="cChangeRow" style="display:none"><span>Change</span><span id="cChange" class="bold"></span></div>
          </div>
        </div>
        <div id="tabCustomer" style="${POS.tab==='customer'?'':'display:none'}">
          <p class="muted" style="font-size:12px;margin:0 0 10px">Optional — prints on the receipt (useful for delivery).</p>
          <div class="field"><label>Name</label><input id="cuName" value="${esc(POS.customer.name)}" autocomplete="off"></div>
          <div class="field"><label>Contact</label><input id="cuContact" type="tel" value="${esc(POS.customer.contact)}" autocomplete="off"></div>
          <div class="field"><label>Address</label><textarea id="cuAddress" rows="3" style="resize:vertical">${esc(POS.customer.address)}</textarea></div>
        </div>
        <button class="btn accent block" id="completeBtn" style="margin-top:14px;padding:11px">Complete Sale &amp; Print</button>
        <button class="btn secondary block" id="clearBtn" style="margin-top:8px">Clear</button>
      </div>
    </div>
    <h2 class="section-title">Orders in this shift</h2>
    <div id="shiftOrders"></div>`;

  function drawMenu(){
    const f=POS.filters, q=f.q.trim().toLowerCase();
    const items=DB.menuItems.filter(m=>m.active!=='N' && (!f.menu||m.menuId===f.menu) && (!f.cat||m.catId===f.cat) && (!q||m.name.toLowerCase().includes(q)));
    const g=c.querySelector('#menuGrid');
    g.innerHTML=items.length?items.map(m=>`<div class="menu-card" data-id="${m.id}"><div class="cat">${esc(catName(m.catId))}</div><div class="nm">${esc(m.name)}</div><div class="pr">${money(m.price)}</div></div>`).join('')
      :'<p class="muted" style="padding:18px;font-size:12.5px">No items match.</p>';
    g.querySelectorAll('.menu-card').forEach(el=>el.onclick=()=>{
      const mi=itemOf(el.dataset.id); if(!mi) return;
      const line=POS.cart.find(x=>x.itemId===mi.id && x.price===Number(mi.price));
      if(line) line.qty++; else POS.cart.push({itemId:mi.id,name:mi.name,catId:mi.catId,menuId:mi.menuId,price:Number(mi.price)||0,qty:1});
      drawCart();
    });
  }
  function totals(){
    const gross=linesGross(POS.cart);
    const disc=calcDiscount(gross,byId(DB.discounts,'id',POS.discId));
    return {gross,disc,net:round2(gross-disc)};
  }
  function drawCart(){
    const w=c.querySelector('#cartItems');
    if(!POS.cart.length) w.innerHTML='<p class="muted" style="font-size:12.5px;margin:8px 0">No items yet — tap a menu card to add.</p>';
    else{
      w.innerHTML=POS.cart.map((l,i)=>`<div class="cart-item"><span class="ci-name">${esc(l.name)}<small>${fmtNum(l.price,2)} × ${l.qty} = ${fmtNum(l.price*l.qty,2)}</small></span>
        <span class="qtybox"><button data-i="${i}" data-d="-1">−</button><b>${l.qty}</b><button data-i="${i}" data-d="1">+</button><button data-i="${i}" data-d="x" style="color:var(--danger)">✕</button></span></div>`).join('');
      w.querySelectorAll('button').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i; if(b.dataset.d==='x') POS.cart.splice(i,1); else { POS.cart[i].qty+=+b.dataset.d; if(POS.cart[i].qty<=0) POS.cart.splice(i,1); }
        drawCart();
      });
    }
    const t=totals();
    c.querySelector('#cGross').textContent=money(t.gross);
    c.querySelector('#cDisc').textContent='-'+money(t.disc);
    c.querySelector('#cNet').textContent=money(t.net);
    const tend=parseFloat(POS.tendered);
    const row=c.querySelector('#cChangeRow');
    if(POS.pay==='Cash' && tend>0 && POS.cart.length){ row.style.display=''; const ch=tend-t.net; c.querySelector('#cChange').textContent=ch<0?'Short '+money(-ch):money(ch); c.querySelector('#cChange').style.color=ch<0?'var(--danger)':'var(--good)'; }
    else row.style.display='none';
  }
  function drawOrders(){
    const ssNow=byId(DB.shiftSessions,'id',ss.id)||ss;
    const os=shiftOrders(ss.id).slice().sort((a,b)=>(b.date+b.time+b.id).localeCompare(a.date+a.time+a.id));
    const st=shiftStats(ssNow);
    c.querySelector('#shiftLive').innerHTML=`${st.orders} orders · Net <b>${money(st.net)}</b>`;
    const w=c.querySelector('#shiftOrders');
    if(!os.length){ w.innerHTML='<p class="muted">No orders in this shift yet.</p>'; return; }
    w.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Order #</th><th>Time</th><th>Type</th><th class="num">Items</th><th class="num">Gross</th><th class="num">Discount</th><th class="num">Net</th><th>Payment</th><th></th></tr></thead><tbody>
      ${os.map(o=>`<tr${o.id===POS.editingId?' style="background:var(--gold-soft)"':''}><td class="mono">${esc(o.id)}${o._unsynced?' <span class="tag warn" title="Not yet synced to cloud">⏳</span>':''}</td><td>${esc(o.time)}</td><td>${esc(o.orderType)}</td>
        <td class="num">${fmtQty(o.items.reduce((s,l)=>s+l.qty,0))}</td><td class="num">${money(o.gross)}</td><td class="num">${money(o.discount)}</td><td class="num bold">${money(o.net)}</td><td>${esc(o.payMethod)}</td>
        <td style="white-space:nowrap"><button class="btn small secondary" data-print="${o.id}">Print</button>
          ${canModifyOrder(o,'edit')?`<button class="btn small secondary" data-edit="${o.id}">✎</button>`:''}
          ${canModifyOrder(o,'del')?`<button class="row-del" data-del="${o.id}" title="Delete order">✕</button>`:''}</td></tr>`).join('')}
      </tbody></table></div>`;
    w.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>showReceipt(byId(DB.orders,'id',b.dataset.print)));
    w.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>loadForEdit(b.dataset.edit));
    w.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      if(!confirm('Delete order '+b.dataset.del+'? This removes it from all reports.')) return;
      if(POS.editingId===b.dataset.del) resetPOS();
      removeOrder(b.dataset.del); toast('Order deleted'); renderPOSPage(c);
    });
  }
  function loadForEdit(id){
    const o=byId(DB.orders,'id',id); if(!o) return;
    POS.editingId=id; POS.cart=o.items.map(l=>Object.assign({},l));
    POS.orderType=o.orderType; POS.discId=o.discId; POS.pay=o.payMethod; POS.tendered=o.tendered||'';
    POS.customer=Object.assign({name:'',contact:'',address:''},o.customer||{});
    renderPOSPage(c); window.scrollTo({top:0,behavior:'smooth'});
  }
  function syncEditUI(){
    const ban=c.querySelector('#posEditBanner'), btn=c.querySelector('#completeBtn'), clr=c.querySelector('#clearBtn');
    if(POS.editingId){ ban.style.display='block'; ban.textContent='✎ Editing order '+POS.editingId+' — change items/discount/payment, then Save.'; btn.textContent='Save changes to '+POS.editingId; clr.textContent='Cancel edit'; }
    else { ban.style.display='none'; btn.textContent='Complete Sale & Print'; clr.textContent='Clear'; }
  }

  c.querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>{ POS.tab=t.dataset.tab;
    c.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===t));
    c.querySelector('#tabOrder').style.display=POS.tab==='order'?'':'none'; c.querySelector('#tabCustomer').style.display=POS.tab==='customer'?'':'none'; });
  c.querySelector('#fMenu').onchange=e=>{ POS.filters.menu=e.target.value; drawMenu(); };
  c.querySelector('#fCat').onchange=e=>{ POS.filters.cat=e.target.value; drawMenu(); };
  c.querySelector('#fQ').oninput=e=>{ POS.filters.q=e.target.value; drawMenu(); };
  c.querySelectorAll('#segType button').forEach(b=>b.onclick=()=>{ POS.orderType=b.dataset.v; c.querySelectorAll('#segType button').forEach(x=>x.classList.toggle('on',x===b)); });
  c.querySelectorAll('#segPay button').forEach(b=>b.onclick=()=>{ POS.pay=b.dataset.v; c.querySelectorAll('#segPay button').forEach(x=>x.classList.toggle('on',x===b)); c.querySelector('#tenderWrap').style.display=POS.pay==='Cash'?'':'none'; drawCart(); });
  c.querySelector('#posDisc').onchange=e=>{ POS.discId=e.target.value; drawCart(); };
  c.querySelector('#posTender').oninput=e=>{ POS.tendered=e.target.value; drawCart(); };
  [['cuName','name'],['cuContact','contact'],['cuAddress','address']].forEach(([id,k])=>c.querySelector('#'+id).oninput=e=>{ POS.customer[k]=e.target.value; });
  c.querySelector('#clearBtn').onclick=()=>{ resetPOS(); renderPOSPage(c); };
  c.querySelector('#xRptBtn').onclick=()=>showZReport(ss.id);
  c.querySelector('#closeShiftBtn').onclick=()=>openCloseShiftModal(ss.id,()=>renderPOSPage(c));

  c.querySelector('#completeBtn').onclick=async()=>{
    if(POS.saving) return;
    if(!POS.cart.length){ toast('Add at least one item first'); return; }
    const t=totals();
    const tend=parseFloat(POS.tendered)||0;
    if(POS.pay==='Cash' && tend>0 && tend<t.net){ toast('Cash received is less than the net payable'); return; }
    const disc=byId(DB.discounts,'id',POS.discId);
    const cust={name:POS.customer.name.trim(),contact:POS.customer.contact.trim(),address:POS.customer.address.trim()};
    const hasCust=cust.name||cust.contact||cust.address;
    const common={orderType:POS.orderType,discId:disc?disc.id:'',discName:disc?disc.name:'',discType:disc?disc.type:'',discValue:disc?Number(disc.value)||0:0,
      payMethod:POS.pay,items:POS.cart.map(l=>Object.assign({},l)),gross:t.gross,discount:t.disc,net:t.net,
      tendered:POS.pay==='Cash'&&tend>0?tend:null,change:POS.pay==='Cash'&&tend>0?round2(tend-t.net):null,customer:hasCust?cust:null,status:'Paid'};
    POS.saving=true; const btn=c.querySelector('#completeBtn'); btn.disabled=true;
    try{
      let order;
      if(POS.editingId){
        order=byId(DB.orders,'id',POS.editingId);
        if(!order){ toast('Order no longer exists'); resetPOS(); renderPOSPage(c); return; }
        Object.assign(order,common,{editedAt:localISO()+' '+nowTime(),editedBy:currentUser.name});
        saveOrder(order); toast('Order '+order.id+' updated');
      }else{
        const id=await nextId('order','ORD',DB.orders,5);
        order=Object.assign({id,date:localISO(),time:nowTime(),shiftSessionId:ss.id,shiftName:ss.shiftName,cashierId:currentUser.id,cashierName:currentUser.name},common);
        saveOrder(order); toast('Order '+id+' completed');
      }
      resetPOS(); POS.tab='order';
      renderPOSPage(c);
      showReceipt(order);
    }finally{ POS.saving=false; }
  };

  drawMenu(); drawCart(); drawOrders(); syncEditUI();
  window._posRefresh=()=>{ if(!myOpenShift()){ renderPOSPage(c); return; } drawOrders(); };
}

    ${s.address?`<div class="c">${esc(s.address)}</div>`:''}${s.phone?`<div class="c">Tel: ${esc(s.phone)}</div>`:''}
    <hr>

    <hr>
    <div class="receipt-line"><span>Gross Sales</span><span>${fmtNum(o.gross,2)}</span></div>

function openCloseShiftModal(ssId,after){
  const ss=byId(DB.shiftSessions,'id',ssId); if(!ss) return;
  const st=shiftStats(ss);
  const m=openModal(`
    <h3>Close Shift ${esc(ss.id)} — Cash Count</h3>
    <p class="muted" style="font-size:12px;margin:0 0 12px">${esc(ss.cashierName)} · ${esc(ss.shiftName)} · ${st.orders} orders · Net ${money(st.net)}</p>
    <table><thead><tr><th>Note</th><th class="num">Count</th><th class="num">Amount</th></tr></thead><tbody>
      ${DENOMS.map(d=>`<tr><td>${esc(cur())} ${d.toLocaleString()}</td><td class="num"><input type="number" class="inp dn" data-d="${d}" min="0" step="1" value="${(ss.denoms||{})[d]||0}" style="width:80px;text-align:right"></td><td class="num" id="da${d}">0</td></tr>`).join('')}
      <tr><td>Coins / loose (amount)</td><td class="num"><input type="number" class="inp" id="dnCoins" min="0" step="1" value="${ss.coins||0}" style="width:80px;text-align:right"></td><td class="num" id="daCoins">0</td></tr>

      <tr><td colspan="2"><b>Difference</b></td><td class="num" id="dnDiff">0</td></tr>

    <div class="modal-actions"><button class="btn secondary" id="dnCancel">Cancel</button><button class="btn" id="dnConfirm">Close Shift &amp; Generate Z Report</button></div>`, 500);
  const calc=()=>{
    let t=0; m.querySelectorAll('.dn').forEach(i=>{ const a=(parseFloat(i.value)||0)*(+i.dataset.d); t+=a; m.querySelector('#da'+i.dataset.d).textContent=fmtNum(a,0); });

    m.querySelector('#dnTotal').textContent=money(t);

    el.textContent=(d>0?'Excess +':d<0?'Short ':'')+money(Math.abs(d)); el.className='num '+(d<0?'neg-val':d>0?'pos-val':'');
    return t;
  };
  m.querySelectorAll('input').forEach(i=>i.oninput=calc); calc();
  m.querySelector('#dnCancel').onclick=closeModal;
  m.querySelector('#dnConfirm').onclick=()=>{
    const total=calc(); const den={};
    m.querySelectorAll('.dn').forEach(i=>den[i.dataset.d]=parseFloat(i.value)||0);
    Object.assign(ss,{denoms:den,coins:parseFloat(m.querySelector('#dnCoins').value)||0,countedCash:round2(total),remarks:m.querySelector('#dnRemarks').value,
      status:'Closed',closeDate:localISO(),closeTime:nowTime(),closedBy:currentUser.name});
    saveShift(ss); closeModal(); toast('Shift '+ss.id+' closed');
    if(after) after();
    showZReport(ss.id);
  };
}

/* ---------- Report filter helpers ---------- */
function presetRange(p){
  const t=localISO();
  if(p==='today') return [t,t];
  if(p==='yesterday'){ const y=addDays(t,-1); return [y,y]; }
  if(p==='last7') return [addDays(t,-6),t];
  if(p==='month') return [t.slice(0,8)+'01',t];
  if(p==='lastmonth'){ const d=new Date(t.slice(0,8)+'01T00:00:00'); d.setDate(0); const e=localISO(d); return [e.slice(0,8)+'01',e]; }
  if(p==='year') return [t.slice(0,5)+'01-01',t];
  if(p==='all'){ const ds=DB.orders.map(o=>o.date).filter(Boolean).sort(); return [ds[0]||t, t]; }
  return null;
}
const PRESETS=[['today','Today'],['yesterday','Yesterday'],['last7','Last 7 days'],['month','This month'],['lastmonth','Last month'],['year','This year'],['all','All time'],['custom','Custom']];
function periodText(f){ return 'Period: '+fmtDate(f.from)+' to '+fmtDate(f.to); }

    const total={orders:sum('orders'),gross:sum('gross'),discount:sum('discount'),net:sum('net'),cash:sum('cash'),card:sum('card'),online:sum('online'),opening:sum('opening'),expected:sum('expected'),
      counted:rows.some(r=>r.counted!==null)?sum('counted'):null, diff:rows.some(r=>r.diff!==null)?sum('diff'):null};
    const detail={title:'Shift-wise Detail',cols:[{label:'Shift ID',key:'id'},{label:'Date',key:'date'},{label:'Shift',key:'shift'},{label:'Cashier',key:'cashier'},{label:'Time',key:'time'},{label:'Status',key:'status'},

      {label:'Cash',key:'cash',type:'money'},{label:'Card',key:'card',type:'money'},{label:'Online',key:'online',type:'money'},{label:'Opening Cash',key:'opening',type:'money'},
      {label:'Expected Cash',key:'expected',type:'money'},{label:'Counted Cash',key:'counted',type:'money'},{label:'Difference',key:'diff',type:'diff'}],rows,total,empty:'No shifts in this period.'};
    const byName={}; list.forEach(s=>{ const st=shiftStats(s); const k=s.shiftName; byName[k]=byName[k]||{shift:k,sessions:0,orders:0,gross:0,discount:0,net:0,cash:0,card:0,online:0};
      const r=byName[k]; r.sessions++; ['orders','gross','discount','net','cash','card','online'].forEach(x=>r[x]+=st[x]); });
    const nRows=SHIFT_NAMES.filter(n=>byName[n]).map(n=>byName[n]).concat(Object.keys(byName).filter(n=>!SHIFT_NAMES.includes(n)).map(n=>byName[n]));
    const nTotal={sessions:rows.length,orders:total.orders,gross:total.gross,discount:total.discount,net:total.net,cash:total.cash,card:total.card,online:total.online};

    return {detail,byShiftName,total,meta};

  const draw=()=>{
    const r=build();

const RS={preset:'month',from:'',to:'',menuId:'',catId:'',orderType:'',payMethod:'',shiftName:'',tab:'menuType'};
function salesDef(dimKey){
  const f=RS; const orders=filterOrders(f); const agg=aggregate(orders,dimKey,f); const d=DIMS[dimKey];
  const cols=[{label:d.label,key:'name'}];
  if(dimKey==='item') cols.push({label:'Category',key:'cat'});
  cols.push({label:'Orders',key:'orders',type:'int'},{label:'Qty Sold',key:'qty',type:'qty'},{label:'Gross Sales',key:'gross',type:'money'},
    {label:'Discount',key:'discount',type:'money'},{label:'Net Sales',key:'net',type:'money'},{label:'% of Net',key:'share',type:'pct'});
  return {def:{title:'Sales by '+d.label,cols,rows:agg.rows,total:agg.total},total:agg.total};
}
function salesMeta(){
  const f=RS; const parts=[];
  if(f.menuId) parts.push('Menu Type: '+menuName(f.menuId));
  if(f.catId) parts.push('Category: '+catName(f.catId));
  if(f.orderType) parts.push('Order Type: '+f.orderType);
  if(f.payMethod) parts.push('Payment: '+f.payMethod);
  if(f.shiftName) parts.push('Shift: '+f.shiftName);
  const lines=[periodText(f)];
  if(parts.length) lines.push('Filters: '+parts.join(' · '));
  return reportMeta(lines);
}

      <div class="field"><label>Menu Type</label><select id="rMenu"><option value="">All</option>${DB.menus.map(m=>`<option value="${m.id}" ${f.menuId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Category</label><select id="rCat"><option value="">All</option>${DB.menuCategories.map(x=>`<option value="${x.id}" ${f.catId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Order Type</label><select id="rType"><option value="">All</option>${ORDER_TYPES.map(t=>`<option ${f.orderType===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Payment</label><select id="rPay"><option value="">All</option>${PAY_METHODS.map(t=>`<option ${f.payMethod===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Shift</label><select id="rShift"><option value="">All</option>${SHIFT_NAMES.map(t=>`<option ${f.shiftName===t?'selected':''}>${t}</option>`).join('')}</select></div>
    </div></div>
    <div id="rEq"></div>
    <div class="tabs" id="rTabs">${RPT_TABS.map(t=>`<div class="tab ${f.tab===t[0]?'active':''}" data-t="${t[0]}">${t[1]}</div>`).join('')}</div>
    <div class="flexrow" style="margin-bottom:10px"><b id="rTitle"></b><span class="spacer"></span>
      <button class="btn small secondary" id="rPdf">⬇ PDF</button><button class="btn small secondary" id="rXls">⬇ Excel</button>
      <button class="btn small" id="rXlsAll" title="One Excel workbook with every report view as a separate sheet">⬇ Excel — all views</button></div>
    <div id="rBody"></div>`;
  const draw=()=>{
    const r=salesDef(f.tab); const t=r.total;
    c.querySelector('#rEq').innerHTML=`<div class="equation">
      <div class="eq-box"><div class="label">Gross Sales</div><div class="value">${money(t.gross)}</div></div><div class="eq-op">−</div>
      <div class="eq-box disc"><div class="label">Discount</div><div class="value">${money(t.discount)}</div></div><div class="eq-op">=</div>
      <div class="eq-box net"><div class="label">Net Sales</div><div class="value">${money(t.net)}</div></div>
      <div class="eq-box"><div class="label">Orders · Items · Avg</div><div class="value" style="font-size:15px">${t.orders} · ${fmtQty(t.qty)} · ${money(t.avg)}</div></div></div>`;
    c.querySelector('#rTitle').textContent=r.def.title;
    c.querySelector('#rBody').innerHTML=tableHTML(r.def);
  };
  const upd=()=>{ f.preset=c.querySelector('#rPreset').value; f.from=c.querySelector('#rFrom').value; f.to=c.querySelector('#rTo').value;
    f.menuId=c.querySelector('#rMenu').value; f.catId=c.querySelector('#rCat').value; f.orderType=c.querySelector('#rType').value;
    f.payMethod=c.querySelector('#rPay').value; f.shiftName=c.querySelector('#rShift').value; draw(); };
  c.querySelector('#rPreset').onchange=e=>{ const r=presetRange(e.target.value); if(r){ c.querySelector('#rFrom').value=r[0]; c.querySelector('#rTo').value=r[1]; } upd(); };
  ['#rFrom','#rTo'].forEach(id=>c.querySelector(id).onchange=()=>{ c.querySelector('#rPreset').value='custom'; upd(); });
  ['#rMenu','#rCat','#rType','#rPay','#rShift'].forEach(id=>c.querySelector(id).onchange=upd);
  c.querySelectorAll('#rTabs .tab').forEach(t=>t.onclick=()=>{ f.tab=t.dataset.t; c.querySelectorAll('#rTabs .tab').forEach(x=>x.classList.toggle('active',x===t)); draw(); });
  const fname=()=>'sales-'+safeName(DIMS[f.tab].label)+'-'+f.from+'-to-'+f.to;
  c.querySelector('#rPdf').onclick=()=>{ const r=salesDef(f.tab); exportPDF(r.def.title,[r.def],salesMeta(),fname()); };
  c.querySelector('#rXls').onclick=()=>{ const r=salesDef(f.tab); exportExcel([{sheet:r.def.title.replace('Sales by ',''),title:r.def.title,meta:salesMeta(),def:r.def}],fname()); };
  c.querySelector('#rXlsAll').onclick=()=>{ const meta=salesMeta(); exportExcel(RPT_TABS.map(([k,l])=>{ const r=salesDef(k); return {sheet:l,title:r.def.title,meta,def:r.def}; }),'sales-all-views-'+f.from+'-to-'+f.to); };
  draw();
}

function renderRolesPage(c){
  const PAGES_FOR_PERMS=PAGES.map(p=>({key:p.key,label:p.label,group:p.group}));
  const RIGHTS=['view','add','edit','del'], RL={view:'View',add:'Add',edit:'Edit',del:'Delete'};
  const roles=DB.roles;
  c.innerHTML=`
    <h1 class="page-title">Roles &amp; Permissions</h1>
    <p class="page-desc">Each role decides which pages a user sees and what they can do there. Admin always has full access. For POS: <b>Add</b> = ring up sales, <b>Edit/Delete</b> = change orders in an open shift. For Cashier Shifts: <b>Edit</b> = see and close other cashiers' shifts.</p>
    ${canAdd('roles')?'<button class="btn" id="addRole" style="margin-bottom:14px">+ Add Role</button>':''}
    <div class="table-wrap"><table><thead><tr><th>Role</th><th>Pages visible</th><th>Users</th><th></th></tr></thead><tbody>
      <tr><td><b>Admin</b></td><td><span class="tag info">Full access</span></td><td>${DB.users.filter(u=>u.role==='Admin').length}</td><td></td></tr>
      ${roles.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td><span class="tag">${PAGES_FOR_PERMS.filter(p=>(r.permissions[p.key]||{}).view).length}/${PAGES_FOR_PERMS.length}</span></td>
        <td>${DB.users.filter(u=>u.role===r.name).length}</td>
        <td style="white-space:nowrap">${canEdit('roles')?`<button class="btn small secondary" data-edit="${r.id}">✎ Edit Permissions</button>`:''}
        ${canDel('roles')?`<button class="row-del" data-del="${r.id}">✕</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>`;
  const open=(id)=>{
    const role=id?roles.find(r=>r.id===id):null; const perms=role?role.permissions:{};
    const groups=[...new Set(PAGES_FOR_PERMS.map(p=>p.group))];
    const m=openModal(`<h3>${role?'Edit Role: '+esc(role.name):'New Role'}</h3>
      <div class="field" style="max-width:280px;margin-top:10px"><label>Role Name</label><input id="rmName" value="${esc(role?role.name:'')}"></div>
      <div class="table-wrap"><table><thead><tr><th>Page</th>${RIGHTS.map(r=>`<th style="text-align:center">${RL[r]}</th>`).join('')}<th style="text-align:center">All</th></tr></thead><tbody>
      ${groups.map(g=>`<tr><td colspan="6" style="background:var(--primary-soft);font-weight:700;font-size:11px;color:var(--primary-dark)">${esc(g)}</td></tr>`+
        PAGES_FOR_PERMS.filter(p=>p.group===g).map(p=>{ const pr=perms[p.key]||{}; return `<tr><td>${esc(p.label)}</td>${RIGHTS.map(r=>`<td style="text-align:center"><input type="checkbox" data-p="${p.key}" data-r="${r}" ${pr[r]?'checked':''}></td>`).join('')}
          <td style="text-align:center"><input type="checkbox" class="allrow" data-p="${p.key}" ${RIGHTS.every(r=>pr[r])?'checked':''}></td></tr>`; }).join('')).join('')}
      </tbody></table></div>
      <div class="modal-actions"><button class="btn secondary" id="rmCancel">Cancel</button><button class="btn" id="rmSave">Save Role</button></div>`, 720);
    m.querySelectorAll('.allrow').forEach(cb=>cb.onchange=()=>m.querySelectorAll(`input[data-p="${cb.dataset.p}"][data-r]`).forEach(x=>x.checked=cb.checked));
    m.querySelectorAll('input[data-r]').forEach(cb=>cb.onchange=()=>{
      if(cb.checked && cb.dataset.r!=='view') m.querySelector(`input[data-p="${cb.dataset.p}"][data-r="view"]`).checked=true;
      m.querySelector(`.allrow[data-p="${cb.dataset.p}"]`).checked=RIGHTS.every(r=>m.querySelector(`input[data-p="${cb.dataset.p}"][data-r="${r}"]`).checked);
    });
    m.querySelector('#rmCancel').onclick=closeModal;
    m.querySelector('#rmSave').onclick=()=>{
      const name=m.querySelector('#rmName').value.trim();
      if(!name){ toast('Role name is required'); return; }
      if(name.toLowerCase()==='admin' || roles.some(r=>r!==role && r.name.toLowerCase()===name.toLowerCase())){ toast('That role name is already used'); return; }
      const np={}; PAGES_FOR_PERMS.forEach(p=>{ np[p.key]={}; RIGHTS.forEach(r=>np[p.key][r]=m.querySelector(`input[data-p="${p.key}"][data-r="${r}"]`).checked); });
      if(role){ if(role.name!==name) DB.users.forEach(u=>{ if(u.role===role.name) u.role=name; }); role.name=name; role.permissions=np; }
      else roles.push({id:uid('ROL',roles,'id',3),name,permissions:np});
      saveMaster(); closeModal(); toast('Role saved'); buildNav(); renderRolesPage(c);
    };
  };
  const ab=c.querySelector('#addRole'); if(ab) ab.onclick=()=>open(null);
  c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(b.dataset.edit));
  c.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const r=roles.find(x=>x.id===b.dataset.del);
    if(DB.users.some(u=>u.role===r.name)){ toast('Cannot delete — this role is assigned to users'); return; }
    if(!confirm('Delete role "'+r.name+'"?')) return;
    DB.roles=roles.filter(x=>x!==r); saveMaster(); renderRolesPage(c); toast('Role deleted');
  });
}

function renderUsersPage(c){
  const cE=canEdit('users'), cD=canDel('users');
  c.innerHTML=`
    <h1 class="page-title">User Accounts</h1>
    <p class="page-desc">Login accounts. What each user can do comes from their role (Setup → Roles &amp; Permissions). Set a user Inactive to block login without losing their sales history.</p>
    ${canAdd('users')?'<button class="btn" id="addUser" style="margin-bottom:14px">+ Add User</button>':''}
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Username</th><th>Role</th><th>Status</th>${(cE||cD)?'<th></th>':''}</tr></thead><tbody>
      ${DB.users.map(u=>`<tr><td class="mono">${esc(u.id)}</td><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td><span class="tag ${u.role==='Admin'?'info':''}">${esc(u.role)}</span></td>
        <td><span class="tag ${u.active==='N'?'bad':'good'}">${u.active==='N'?'Inactive':'Active'}</span></td>
        ${(cE||cD)?`<td style="white-space:nowrap">${cE?`<button class="btn small secondary" data-edit="${u.id}">✎ Edit</button>`:''}${cD&&u.id!==currentUser.id?`<button class="row-del" data-del="${u.id}">✕</button>`:''}</td>`:''}</tr>`).join('')}
    </tbody></table></div>`;
  const open=id=>{
    const u=id?byId(DB.users,'id',id):null;
    const roleNames=['Admin',...DB.roles.map(r=>r.name)];
    const m=openModal(`<h3>${u?'Edit User':'Add User'}</h3>
      <div style="margin-top:12px">
      <div class="field"><label>Full Name *</label><input id="umName" value="${esc(u?u.name:'')}"></div>
      <div class="field"><label>Username *</label><input id="umUser" value="${esc(u?u.username:'')}" autocomplete="off"></div>
      <div class="field"><label>Password *</label><input id="umPass" type="text" value="${esc(u?u.password:'')}" autocomplete="off"></div>
      <div class="field"><label>Role *</label><select id="umRole">${roleNames.map(r=>`<option ${u&&u.role===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>
      <div class="field"><label>Status</label><select id="umActive"><option value="Y">Active</option><option value="N" ${u&&u.active==='N'?'selected':''}>Inactive</option></select></div></div>
      <div class="modal-actions"><button class="btn secondary" id="umCancel">Cancel</button><button class="btn" id="umSave">Save</button></div>`, 440);
    m.querySelector('#umCancel').onclick=closeModal;
    m.querySelector('#umSave').onclick=()=>{
      const rec={name:m.querySelector('#umName').value.trim(),username:m.querySelector('#umUser').value.trim(),password:m.querySelector('#umPass').value.trim(),
        role:m.querySelector('#umRole').value,active:m.querySelector('#umActive').value};
      if(!rec.name||!rec.username||!rec.password){ toast('Name, username and password are required'); return; }
      if(DB.users.some(x=>x.username.toLowerCase()===rec.username.toLowerCase() && x!==u)){ toast('Username already exists'); return; }
      const adminsLeft=DB.users.filter(x=>x!==u && x.role==='Admin' && x.active!=='N').length;
      if(u && u.role==='Admin' && (rec.role!=='Admin'||rec.active==='N') && adminsLeft===0){ toast('At least one active Admin is required'); return; }
      if(u && u.id===currentUser.id && rec.active==='N'){ toast('You cannot deactivate your own account'); return; }
      if(u) Object.assign(u,rec); else DB.users.push(Object.assign({id:uid('USR',DB.users,'id',3)},rec));
      saveMaster(); closeModal(); toast('User saved'); if(u&&u.id===currentUser.id){ updateNavUser(); buildNav(); } renderUsersPage(c);
    };
  };
  const ab=c.querySelector('#addUser'); if(ab) ab.onclick=()=>open(null);
  c.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(b.dataset.edit));
  c.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const u=byId(DB.users,'id',b.dataset.del);
    if(u.role==='Admin' && DB.users.filter(x=>x.role==='Admin'&&x.active!=='N'&&x!==u).length===0){ toast('Cannot delete the last Admin'); return; }
    if(DB.orders.some(o=>o.cashierId===u.id) && !confirm(u.name+' has sales history. Their past orders stay in reports. Delete the login anyway? (Tip: set Inactive instead)')) return;
    if(!DB.orders.some(o=>o.cashierId===u.id) && !confirm('Delete user '+u.name+'?')) return;
    DB.users=DB.users.filter(x=>x!==u); saveMaster(); renderUsersPage(c); toast('User deleted');
  });
}
