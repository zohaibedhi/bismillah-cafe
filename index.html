function closeDropdowns(){ document.querySelectorAll('.nav-dropdown').forEach(d=>d.classList.remove('show')); document.querySelectorAll('.nav-menu-btn').forEach(b=>b.classList.remove('open')); }
function buildNav(){
  const groups={},order=[];
  PAGES.forEach(p=>{ if(!canView(p.key)) return; if(!groups[p.group]){ groups[p.group]=[]; order.push(p.group); } groups[p.group].push(p); });
  const nm=document.getElementById('navMenus');
  nm.innerHTML=order.map((g,i)=>`<div class="nav-menu-item"><button class="nav-menu-btn" data-g="${i}" data-group="${esc(g)}">${esc(g)} <span style="opacity:.6;font-size:10px">▾</span></button>
    <div class="nav-dropdown" id="navdd-${i}">${groups[g].map(p=>`<a class="nav-dd-item" href="#" data-key="${p.key}">${esc(p.label)}</a>`).join('')}</div></div>`).join('');
  nm.querySelectorAll('.nav-menu-btn').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const dd=document.getElementById('navdd-'+b.dataset.g); const was=dd.classList.contains('show'); closeDropdowns(); if(!was){ dd.classList.add('show'); b.classList.add('open'); } });
  nm.querySelectorAll('.nav-dd-item').forEach(a=>a.onclick=e=>{ e.preventDefault(); closeDropdowns(); navigateTo(a.dataset.key); });
}
function navigateTo(key){
  destroyCharts(); closeModal(); window._posRefresh=null;
  const c=document.getElementById('content');
  if(!canView(key)){ const first=PAGES.find(p=>canView(p.key)); if(first && first.key!==key) return navigateTo(first.key);
    c.innerHTML='<div class="panel"><h2>No access</h2><p>Your role has no pages enabled. Ask an Admin.</p></div>'; return; }
  currentPage=key;
  const pg=PAGES.find(p=>p.key===key);
  document.querySelectorAll('.nav-dd-item').forEach(el=>el.classList.toggle('active',el.dataset.key===key));
  document.querySelectorAll('.nav-menu-btn').forEach(b=>b.classList.toggle('active-group',b.dataset.group===pg.group));
  pg.render(c);
  window.scrollTo(0,0);
}

function showLoading(msg){
  let o=document.getElementById('_loading');
  if(!o){ o=document.createElement('div'); o.id='_loading';
    o.style.cssText='position:fixed;inset:0;background:#f5f7f5;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:sans-serif';
    o.innerHTML='<div style="font-size:30px">🔄</div><div style="font-weight:600;color:#0E5C4E">Loading…</div><div id="_loadingMsg" style="font-size:12px;color:#666"></div>';
    document.body.appendChild(o); }
  document.getElementById('_loadingMsg').textContent=msg||'';
}
function hideLoading(){ const o=document.getElementById('_loading'); if(o) o.remove(); }
function enterApp(){
  document.getElementById('loginOverlay').classList.remove('show');
  document.getElementById('app').style.display='flex';
  updateNavUser(); buildNav();
  const first=PAGES.find(p=>canView(p.key));
  navigateTo(canView('pos') && currentUser.role==='Cashier' ? 'pos' : (first?first.key:'dashboard'));
}
async function boot(){
  showLoading('Opening data…');
  const cfg=getFbCfg();
  const local=loadLocal();
  if(cfg.dbUrl && cfg.apiKey && cfg.projectId && initFirebase(cfg)){
    setSync('syncing','⟳ Connecting…'); showLoading('Connecting to cloud…');
    try{
      const snap=await withTimeout(_fbRoot.once('value'),9000);
      const v=snap.val();
      if(v && v.master){
        DB=fromRemote(v);
        if(local){ // push anything sold on this device while offline
          local.orders.filter(o=>o._unsynced && !DB.orders.some(x=>x.id===o.id)).forEach(o=>DB.orders.push(o));
          local.shiftSessions.filter(s=>s._unsynced).forEach(s=>{ const i=DB.shiftSessions.findIndex(x=>x.id===s.id); if(i>=0) DB.shiftSessions[i]=s; else DB.shiftSessions.push(s); });
        }
      } else {
        DB=local||normalize(seedData());
        await _fbRoot.set(toRemote(DB));
      }
      setSync('synced','✓ Synced');
    }catch(e){
      DB=local||normalize(seedData());
      setSync('error','✕ Offline – local cache');
    }
    saveLocal(); startListener();
  } else {
    if(cfg.dbUrl) setSync('error','✕ Config error');
    DB=local||normalize(seedData()); saveLocal();
  }
  applyBranding(); hideLoading();
  if(restoreSession()) enterApp(); else document.getElementById('loginOverlay').classList.add('show');
}

document.getElementById('printReceiptBtn').onclick=()=>window.print();
document.getElementById('receiptModal').addEventListener('click',e=>{ if(e.target.id==='receiptModal') e.target.classList.remove('show'); });
document.addEventListener('click',e=>{ if(!e.target.closest('#navMenus')) closeDropdowns(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); document.getElementById('receiptModal').classList.remove('show'); } });
function tick(){ const n=new Date(); document.getElementById('clockPill').textContent=n.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' · '+n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
tick(); setInterval(tick,30000);
boot();
</script>
</body>
</html>
